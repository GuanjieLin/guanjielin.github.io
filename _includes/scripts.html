<!-- Theme Toggle Script -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  const themeToggle = document.getElementById('theme-toggle');
  const themeIcon = document.querySelector('.theme-switcher__icon');
  const html = document.documentElement;
  const themeColor = document.querySelector('meta[name="theme-color"]');
  const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)');

  const savedTheme = getSavedTheme();
  const currentTheme = savedTheme || (systemPrefersDark.matches ? 'dark' : 'light');

  applyTheme(currentTheme);

  themeToggle?.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();

    const currentTheme = html.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

    saveTheme(newTheme);
    applyTheme(newTheme);
  });

  systemPrefersDark.addEventListener?.('change', function(event) {
    if (!getSavedTheme()) {
      applyTheme(event.matches ? 'dark' : 'light');
    }
  });

  function getSavedTheme() {
    try {
      return localStorage.getItem('theme');
    } catch (error) {
      return null;
    }
  }

  function saveTheme(theme) {
    try {
      localStorage.setItem('theme', theme);
    } catch (error) {}
  }

  function applyTheme(theme) {
    html.setAttribute('data-theme', theme);

    if (themeIcon) {
      themeIcon.textContent = theme === 'dark' ? '☀' : '☾';
    }

    if (themeToggle) {
      themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      themeToggle.setAttribute('title', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    }

    if (themeColor) {
      themeColor.setAttribute('content', theme === 'dark' ? '#111315' : '#fafaf8');
    }
  }
});
</script>
